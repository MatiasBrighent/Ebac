<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" >
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Crie sua conta</h1>
        <div class="cadastro">
            <form>
                <label class="form-label" for="nome">Nome:</label>
                <input class="form-control" type="text" id="nome" name="nome" required>
                <label class="form-label" for="email">E-mail:</label>
                <input class="form-control" type="email" id="email" name="email" required>
                <label class="form-label" for="tel">Telefone:</label>
                <input class="form-control" type="tel" id="tel" name="tel" required>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox"  id="termos">
                    <label class="form-check-label" for="termos" id="termos">Li e concordo com os <a href="#">termos</a> do site</label>
                </div>
            </form>
            <button type="submit" class="btn btn-success">Cadastrar-se</button>
        </div>
    </div>
    <script src=https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js></script>
    <script>
        $(document).ready(function(){
            $('#tel').mask('(00) 00000-0000')
        })
    </script>
</body>
</html>
